[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["content_style_stability*", "figure*"]
namespaces = false

[tool.setuptools.package-dir]
"" = "src"
figure = "figure"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[project]
name = "content-style-stability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "albumentations>=1.3.0,<1.4",
  "gpboost>=1.7.4,<1.8",
  "lpips>=0.1.4",
  "matplotlib>=3.10,<4",
  "numpy>=1.24.0",
  "opencv-python-headless>=4.8.0",
  "pandas>=2.0.0",
  "pillow>=13.0.0",
  "python-dotenv>=1.0.0,<2",
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "pytest>=7.4.0",
]

[tool.pytest.ini_options]
markers = [
  "integration: opt-in integration tests",
]
filterwarnings = [
  "ignore:CUDA initialization:UserWarning",
  "ignore::UserWarning:torch.cuda",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
content-style-stability-setup = "content_style_stability.cli.setup:main"
content-style-stability-train = "content_style_stability.cli.train:main"
content-style-stability-evaluate = "content_style_stability.cli.evaluate:main"
content-style-stability-calc-score = "content_style_stability.cli.calc_score:main"
content-style-stability-prune = "content_style_stability.cli.prune:main"
content-style-stability-style-transfer = "content_style_stability.cli.style_transfer:main"
content-style-stability-mass-generation = "content_style_stability.cli.mass_generation:main"
content-style-stability-screening = "content_style_stability.cli.screening:main"
content-style-stability-synthesis-mask = "content_style_stability.cli.synthesis_mask:main"
content-style-stability-analyze-behavior = "content_style_stability.cli.analyze_behavior:main"
content-style-stability-figure-behavior = "content_style_stability.cli.figure_behavior:main"
content-style-stability-convert-model-evaluation = "content_style_stability.cli.convert_model_evaluation:main"
content-style-stability-analyze-model-evaluation = "content_style_stability.cli.analyze_model_evaluation:main"
content-style-stability-figure-model-evaluation = "content_style_stability.cli.figure_model_evaluation:main"
content-style-stability-analyze-exclusive-channels = "content_style_stability.cli.analyze_exclusive_channels:main"
content-style-stability-figure-exclusive-channels = "content_style_stability.cli.figure_exclusive_channels:main"
